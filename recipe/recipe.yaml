schema_version: 1

context:
  version: "0.5.0"
  python_min: "3.12"

package:
  name: globato
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/globato/globato-${{ version }}.tar.gz
  sha256: 4f92bd5ae0dd7caa5c0c3a3496044c10ce3c6416d7f1f7d77e7eac23da9c6cf6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - globato = globato.cli:cli
      - wafflez = globato.cli.wafflez:wafflez_build

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - fetchez >=0.11.0
    - transformez >=1.0.0
    - click >=8.1.7
    - h5py >=3.11.0
    - laspy >=2.5.1
    # laszip is an optional dependency of laspy, expressed as laspy[lazrs,laszip] upstream
    - laszip
    - matplotlib-base
    - numpy >1.26.0
    - pandas >=2.1.2
    - geopandas >=1.0.0
    - pyproj >3.6.1
    - pyshp >=2.3.1
    - pyyaml >=6.0.1
    - rasterio >1.4.0
    - requests >=2.31.0
    - scipy >=1.11.2
    - shapely >=2.0.3
    - pyogrio >=0.8.0
    - libgdal-netcdf
    - libgdal-hdf5
    - gmt
    - pygmt

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
      imports:
        - globato
  - script:
      - globato --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/continuous-dems/globato
  summary: |
    A suite of specialized data processors (Multibeam, Lidar, Raster), etc. for
    the Fetchez ecosystem.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/continuous-dems/globato
  documentation: https://globato.readthedocs.io/

extra:
  recipe-maintainers:
    - matth-love
    - mfisher87
